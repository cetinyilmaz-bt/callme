<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CallMee – Asistan</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .screen-label-asst {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 20px; padding: 4px 14px;
      font-size: 11px; font-weight: 600; color: #86efac;
      letter-spacing: 1.5px; text-transform: uppercase;
    }
    .conn-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 500; color: var(--text-dim);
      background: var(--glass); border: 1px solid var(--border);
    }
    .conn-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 6px #22c55e;
      animation: blink 2s infinite;
    }
    .missed-badge {
      position: fixed; top: 16px; right: 16px;
      background: #ef4444; color: #fff;
      border-radius: 50%; width: 24px; height: 24px;
      display: none; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 0 12px rgba(239,68,68,0.6);
      z-index: 400;
    }
    .missed-badge.show { display: flex; }
    body.flash { animation: screen-flash 0.6s ease 3; }
    .divider {
      height: 1px; background: var(--border);
      margin: 0 20px;
    }
    .no-history {
      text-align: center; color: var(--text-dim);
      font-size: 13px; padding: 20px 0;
    }
  </style>
</head>
<body>

  <!-- INCOMING CALL OVERLAY (ÇOKLU ÇAĞRI DESTEĞİ) -->
  <div class="call-overlay" id="callOverlay">
    <div class="call-overlay-header" id="overlayHeader">
      <div class="active-calls-title">
        <span class="active-calls-pulse"></span>
        <span id="activeCallsText">🚨 Aktif Çağrılar</span>
      </div>
      <button class="ack-all-btn" id="ackAllBtn" onclick="acknowledgeAllCalls()" type="button">
        ✓ Tümünü Görüldü Yap
      </button>
    </div>
    <div class="call-cards-container" id="callCardsContainer">
      <!-- Aktif çağrı kartları yan yana buraya basılır -->
    </div>
  </div>

  <!-- MISSED BADGE -->
  <div class="missed-badge" id="missedBadge">0</div>

  <!-- HEADER -->
  <div class="app-header">
    <div class="app-logo">
      <div class="logo-icon">🔔</div>
      <div class="logo-text">CallMee</div>
    </div>
    <div class="app-subtitle">Çağrı Sistemi</div>
    <div class="screen-label-asst">🎧 Asistan Paneli</div>
  </div>

  <!-- STANDBY -->
  <div class="standby-screen" id="standbyScreen">
    <div class="standby-icon">🔕</div>
    <div class="standby-text">Çağrı bekleniyor…</div>
    <div class="conn-badge">
      <div class="dot" id="connDot"></div>
      <span id="connText">Bağlanıyor</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- ODA BAZLI ZİL SESİ AYARLARI -->
  <div class="sound-section">
    <div class="section-header-row">
      <div class="section-title">🔔 Oda Zil Sesi Ayarları</div>
      <button class="reset-sounds-btn" id="resetSoundsBtn" title="Varsayılan Seslere Dön">↺ Sıfırla</button>
    </div>
    <div class="section-desc">Her odadan gelen çağrı için farklı bir ses tonu atayabilir ve test edebilirsiniz.</div>
    <div class="room-sounds-list" id="roomSoundsList">
      <!-- Odalar ve ses seçimleri dinamik doldurulur -->
    </div>
  </div>

  <div class="divider"></div>

  <!-- ÇAĞRI GEÇMİŞİ -->
  <div class="history-section">
    <div class="history-header-row">
      <div class="section-title">
        <span>📋 Son Çağrılar</span>
        <span class="badge-count" id="historyCount">0</span>
      </div>
      <button class="clear-history-btn" id="clearHistoryBtn" title="Listeyi Temizle" type="button">
        🗑️ Temizle
      </button>
    </div>
    <div class="history-list" id="historyList">
      <div class="no-history">Henüz çağrı kaydı yok</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="sounds.js"></script>
  <script>
    const overlay         = document.getElementById('callOverlay');
    const overlayHeader   = document.getElementById('overlayHeader');
    const activeCallsText = document.getElementById('activeCallsText');
    const cardsContainer  = document.getElementById('callCardsContainer');
    const historyList     = document.getElementById('historyList');
    const connDot         = document.getElementById('connDot');
    const connText        = document.getElementById('connText');
    const missedBadge     = document.getElementById('missedBadge');

    const historyCount    = document.getElementById('historyCount');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    let activeCalls = [];
    let missedCount = 0;

    // ── Oda Tanımları (Müdür Ekranı Sırasıyla Uyumlu) ────
    const ROOMS = [
      { key: 'vip', name: 'VIP', icon: '👑', color: '#f59e0b', tag: 'Özel Salon' },
      { key: 'seecolor', name: 'SeeColor', icon: '🎨', color: '#a855f7', tag: 'Tasarım / Ar-Ge' },
      { key: 'akademi', name: 'Akademi', icon: '🎓', color: '#3b82f6', tag: 'Eğitim Odası' },
      { key: 'max', name: 'Max', icon: '⚡', color: '#f97316', tag: 'Toplantı' },
      { key: 'kis-bahcesi', name: 'Kış Bahçesi', icon: '🌿', color: '#22c55e', tag: 'Bahçe Alanı' },
      { key: 'ana-oda', name: 'Ana Oda', icon: '🏛️', color: '#ef4444', tag: 'Yönetim' }
    ];

    // ── Oda Sesleri UI Render ──────────────────────────
    function renderRoomSoundSettings() {
      const container = document.getElementById('roomSoundsList');
      const sounds = AudioManager.getSounds();
      const roomSounds = AudioManager.getRoomSounds();

      container.innerHTML = ROOMS.map(room => {
        const selectedSoundId = roomSounds[room.key] || 1;
        const optionsHtml = Object.values(sounds).map(s =>
          `<option value="${s.id}" ${s.id === selectedSoundId ? 'selected' : ''}>${s.icon} ${s.name}</option>`
        ).join('');

        const currSound = sounds[selectedSoundId] || { name: 'Zil', icon: '🔔' };

        return `
          <div class="room-sound-card" style="--room-color: ${room.color}">
            <div class="room-info">
              <span class="room-icon">${room.icon}</span>
              <div class="room-names">
                <span class="room-title">${room.name}</span>
                <span class="room-sub">${room.tag}</span>
              </div>
            </div>
            <div class="room-controls">
              <select class="room-sound-select" data-room="${room.key}" aria-label="${room.name} zil sesi">
                ${optionsHtml}
              </select>
              <button class="preview-btn-room" data-room="${room.key}" type="button" title="${room.name} için sesi dinle">
                <span>▶</span> Dinle
              </button>
            </div>
          </div>
        `;
      }).join('');

      // Seçim değiştiğinde kaydet ve kısa önizle
      container.querySelectorAll('.room-sound-select').forEach(sel => {
        sel.addEventListener('change', (e) => {
          const roomKey = e.target.dataset.room;
          const soundId = parseInt(e.target.value);
          AudioManager.setRoomSound(roomKey, soundId);
          AudioManager.previewSound(soundId);
        });
      });

      // Dinle butonları
      container.querySelectorAll('.preview-btn-room').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const roomKey = btn.dataset.room;
          const select = container.querySelector(`.room-sound-select[data-room="${roomKey}"]`);
          const soundId = select.value;

          btn.classList.add('playing');
          btn.innerHTML = '<span>🔊</span> Çalıyor';
          AudioManager.previewSound(soundId);
          setTimeout(() => {
            btn.classList.remove('playing');
            btn.innerHTML = '<span>▶</span> Dinle';
          }, 2400);
        });
      });
    }

    document.getElementById('resetSoundsBtn').addEventListener('click', () => {
      AudioManager.resetToDefaults();
      renderRoomSoundSettings();
    });

    renderRoomSoundSettings();

    // ── Tekil Socket Bağlantısı ──────────────────────────────
    const socket = io({
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      timeout: 20000
    });

    socket.on('connect', () => {
      connDot.style.background = '#22c55e';
      connDot.style.boxShadow  = '0 0 6px #22c55e';
      connText.textContent = 'Bağlantı aktif';
    });

    socket.on('disconnect', () => {
      connDot.style.background = '#ef4444';
      connDot.style.boxShadow  = '0 0 6px #ef4444';
      connText.textContent = 'Bağlantı kesildi';
    });

    socket.on('connect_error', () => {
      connDot.style.background = '#f59e0b';
      connDot.style.boxShadow  = '0 0 6px #f59e0b';
      connText.textContent = 'Bağlanıyor…';
    });

    socket.on('incoming_call', (call) => {
      addIncomingCall(call);
    });

    socket.on('call_history', (history) => {
      renderHistory(history);
      // Bekleyen aktif çağrıları senkronize et
      const pendingCalls = (history || []).filter(c => c.status === 'pending');
      activeCalls = pendingCalls;
      renderActiveCalls();
      if (activeCalls.length > 0) {
        AudioManager.play(activeCalls[activeCalls.length - 1].locationKey);
      } else {
        AudioManager.stop();
      }
    });

    socket.on('call_acknowledged', (data) => {
      activeCalls = activeCalls.filter(c => c.id !== data.callId);
      if (activeCalls.length > 0) {
        AudioManager.play(activeCalls[activeCalls.length - 1].locationKey);
      } else {
        AudioManager.stop();
        missedCount = 0;
        missedBadge.classList.remove('show');
      }
      renderActiveCalls();
    });

    // ── Aktif Çağrıları Yan Yana Render Et ────────────
    function renderActiveCalls() {
      if (activeCalls.length === 0) {
        overlay.classList.remove('active');
        overlayHeader.classList.remove('show');
        AudioManager.stop();
        cardsContainer.innerHTML = '';
        return;
      }

      overlay.classList.add('active');
      if (activeCalls.length > 1) {
        overlayHeader.classList.add('show');
        activeCallsText.textContent = `🚨 Aktif Çağrılar (${activeCalls.length})`;
      } else {
        overlayHeader.classList.remove('show');
      }

      const sounds = AudioManager.getSounds();

      cardsContainer.innerHTML = activeCalls.map(call => {
        const soundId = AudioManager.getRoomSound(call.locationKey);
        const sound = sounds[soundId] || { name: 'Zil Sesi', icon: '🔔' };

        return `
          <div class="call-card" id="card-${call.id}">
            <div class="call-pulse-ring" style="--call-color: ${call.color || '#6c63ff'}">
              <span>${call.icon || '📞'}</span>
            </div>
            <div class="call-caller">${call.callerIcon || '👤'} ${call.callerName || 'Müdür'}</div>
            <div class="call-label">Çağrı Geliyor</div>
            <div class="call-location">${call.location}</div>
            <div class="call-sound-tag"><span>${sound.icon}</span> ${sound.name}</div>
            <div class="call-time">${formatDateTime(call.timestamp)}</div>
            <button class="ack-btn" onclick="acknowledgeSingleCall('${call.id}')" type="button">
              ✅ Görüldü
            </button>
          </div>
        `;
      }).join('');
    }

    // ── Gelen Çağrıyı Ekle ────────────────────────────
    function addIncomingCall(call) {
      const idx = activeCalls.findIndex(c => c.id === call.id);
      if (idx === -1) {
        activeCalls.push(call);
      } else {
        activeCalls[idx] = call;
      }

      renderActiveCalls();

      document.body.classList.remove('flash');
      void document.body.offsetWidth;
      document.body.classList.add('flash');

      // Odaya özel atanan ses tonunu çal
      AudioManager.play(call.locationKey);

      // Tarayıcı bildirimi
      sendBrowserNotif(call);

      // Missed sayacı güncelle
      if (document.hidden) {
        missedCount++;
        missedBadge.textContent = missedCount;
        missedBadge.classList.add('show');
      }
    }

    // ── Tek Bir Çağrıyı Görüldü Yap ───────────────────
    function acknowledgeSingleCall(callId) {
      socket.emit('acknowledge_call', { callId: callId });
      activeCalls = activeCalls.filter(c => c.id !== callId);

      if (activeCalls.length > 0) {
        const nextCall = activeCalls[activeCalls.length - 1];
        AudioManager.play(nextCall.locationKey);
      } else {
        AudioManager.stop();
        missedCount = 0;
        missedBadge.classList.remove('show');
      }

      renderActiveCalls();
    }

    // ── Tümünü Görüldü Yap ────────────────────────────
    function acknowledgeAllCalls() {
      activeCalls.forEach(c => {
        socket.emit('acknowledge_call', { callId: c.id });
      });
      activeCalls = [];
      AudioManager.stop();
      missedCount = 0;
      missedBadge.classList.remove('show');
      renderActiveCalls();
    }

    // ── Geçmişi Render Et ─────────────────────────────
    function renderHistory(history) {
      const list = history || [];
      if (historyCount) historyCount.textContent = list.length;

      if (list.length === 0) {
        historyList.innerHTML = '<div class="no-history">Henüz çağrı kaydı yok</div>';
        return;
      }

      const sounds = AudioManager.getSounds();

      historyList.innerHTML = list.slice(0, 30).map(c => {
        const soundId = AudioManager.getRoomSound(c.locationKey);
        const sound = sounds[soundId] || { name: 'Zil Sesi', icon: '🔔' };
        const isPending = c.status === 'pending';

        return `
          <div class="history-item ${isPending ? 'is-pending' : ''}" style="--room-color: ${c.color || '#6c63ff'}">
            <div class="h-left">
              <span class="h-icon">${c.icon || '📞'}</span>
              <div class="h-info">
                <div class="h-loc">
                  <span class="h-room-name">${c.location}</span>
                  <span class="h-caller">${c.callerIcon || '👤'} ${c.callerName || 'Müdür'}</span>
                  <span class="h-sound-badge">${sound.icon} ${sound.name}</span>
                </div>
                <div class="h-time">🕒 ${formatDateTime(c.timestamp)}</div>
              </div>
            </div>
            <div class="h-right">
              ${isPending ? `
                <button class="h-ack-btn" onclick="acknowledgeSingleCall('${c.id}')" type="button">
                  ✅ Görüldü Yap
                </button>
              ` : `
                <span class="h-status acknowledged">✓ Görüldü</span>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    // Geçmişi temizle butonu (ekrandaki listeyi temizler)
    if (clearHistoryBtn) {
      clearHistoryBtn.addEventListener('click', () => {
        historyList.innerHTML = '<div class="no-history">Geçmiş temizlendi</div>';
        if (historyCount) historyCount.textContent = '0';
      });
    }

    // ── Tarayıcı Bildirimi ────────────────────────────
    function sendBrowserNotif(call) {
      if (!('Notification' in window)) return;
      const callerTitle = `${call.callerIcon || '👤'} ${call.callerName || 'Müdür'}`;
      if (Notification.permission === 'granted') {
        try {
          new Notification(`📞 ${callerTitle} – ${call.location}`, {
            body: `${call.callerName || 'Müdür'} sizi ${call.location} odasına çağırıyor.`,
            tag: 'callmee',
            renotify: true
          });
        } catch(e) {}
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission();
      }
    }

    // ── Ses İzni & Web Audio Kilidi Açma ──────────────
    // ── Ses Motorunu Arka Planda Daima Aktif Tut ─────────
    ['click', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, () => AudioManager.unlock(), { once: true, passive: true });
    });

    // ── Yardımcı ──────────────────────────────────────
    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDateTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const time = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const now = new Date();
      const isToday = d.toDateString() === now.toDateString();
      if (isToday) {
        return time;
      }
      const date = d.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit' });
      return `${date} • ${time}`;
    }

    // Sayfa görünür olduğunda missed sıfırla
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !overlay.classList.contains('active')) {
        missedCount = 0;
        missedBadge.classList.remove('show');
      }
    });

    // Bildirim izni iste
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  </script>
</body>
</html>
